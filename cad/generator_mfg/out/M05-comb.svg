oke="#222222" stroke-width="1.5" stroke-linecap="round"/><polygon points="560.0,243.0 568.3,239.5 568.3,246.5" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><polygon points="1134.0,243.0 1125.7,246.5 1125.7,239.5" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><g transform="translate(847.0,243.0) rotate(0.0)"><rect x="-188.4" y="-11.0" width="376.8" height="14.9" rx="0" fill="white" stroke="none" stroke-width="0" fill-opacity="1"/><text x="0.0" y="0.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#222222">82.0 ±0.2  (x 339 to 421, into both end rings)</text></g><text x="847.0" y="289.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b6b6b">ends square, edges broken 0.3</text><text x="120.0" y="454.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#222222">NP1-222 end ring (front and rear, same part)</text><rect x="120.0" y="470.0" width="540.0" height="120.0" rx="8" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><text x="140.0" y="500.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">G11 ring, OD Ø620.0 −0.1/−0.2 (glued in the seat),</text><text x="140.0" y="517.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">ID Ø604.0 ±0.1 (stays 1.5 mm outside the sleeve bore),</text><text x="140.0" y="535.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">width 8.0 −0.1 axial (x 335 to 343 front, x 417 to 425 rear),</text><text x="140.0" y="552.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">40 notches 7.1 deep × comb bar width +0.2, pitch 9.000°.</text><rect x="700.0" y="470.0" width="510.0" height="120.0" rx="8" fill="#f3f4f6" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><text x="715.0" y="500.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">Comb bars are slightly longer than the stack (82 vs 74)</text><text x="715.0" y="517.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">so their ends sit in the end-ring notches:</text><text x="715.0" y="535.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">the ring fixes the angle, the bar fixes the pole.</text><text x="715.0" y="552.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">Locate notch 1 from hub bolt hole 1.</text></svg>