.1 (x 332 to 339.9 front, x 420.1 to 428 rear),</text><text x="140.0" y="552.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">40 notches 7.1 deep × comb bar width +0.2, pitch 9.000°.</text><rect x="700.0" y="470.0" width="510.0" height="120.0" rx="8" fill="#f3f4f6" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><text x="715.0" y="497.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">Two bars per pole gap: one for the front row, one</text><text x="715.0" y="514.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">for the rear row, ends in the end-ring notches.</text><text x="715.0" y="532.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">Rear ring and rear bars are turned 0.50° against</text><text x="715.0" y="549.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">the front ones (skew). Notch 1 from hub bolt hole 1.</text></svg>