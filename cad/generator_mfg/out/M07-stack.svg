<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760"><title>M07 Radial tolerance stack</title><rect width="100%" height="100%" fill="white"/><text x="20.0" y="34.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="start" font-weight="bold" fill="#222222">M07  From the drum to the stator: every layer and its tolerance (radial, mm)</text><text x="20.0" y="58.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#6b6b6b">The sleeve is moulded on the Ø602.0 mandrel, so magnet and bond scatter only change the sleeve thickness, not the air gap.</text><rect x="80.0" y="110.0" width="300.0" height="70.0" rx="0" fill="#b9c0c8" stroke="#222222" stroke-width="1.5" fill-opacity="1"/><text x="230.0" y="151.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">drum seat (radius)</text><text x="410.0" y="141.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#222222"></text><text x="480.0" y="151.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">r 309.325  +0.025/0  (Ø +0.05/0)</text><rect x="80.0" y="186.0" width="300.0" height="46.0" rx="0" fill="#f1e3a6" stroke="#222222" stroke-width="1.5" fill-opacity="1"/><text x="230.0" y="215.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">bond at the corners</text><text x="410.0" y="205.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#222222">0.15</text><text x="480.0" y="215.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">+0.05 / 0  (beads set the minimum)</text><rect x="80.0" y="238.0" width="300.0" height="120.0" rx="0" fill="#d9463b" stroke="#222222" stroke-width="1.5" fill-opacity="1"/><text x="230.0" y="304.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="white">block thickness</text><text x="410.0" y="294.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#222222">7.50</text><text x="480.0" y="304.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">±0.02</text><rect x="80.0" y="364.0" width="300.0" height="46.0" rx="0" fill="#79c37a" stroke="#222222" stroke-width="1.5" fill-opacity="1"/><text x="230.0" y="393.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">sleeve at the block centre</text><text x="410.0" y="383.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#222222">0.51</text><text x="480.0" y="393.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">result: 0.49 to 0.61</text><rect x="80.0" y="416.0" width="300.0" height="70.0" rx="0" fill="#79c37a" stroke="#222222" stroke-width="1.5" fill-opacity="1"/><text x="230.0" y="457.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">sleeve bore (radius)</text><text x="410.0" y="447.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#222222"></text><text x="480.0" y="457.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">r 301.00  +0.025/−0.01, run-out ≤ 0.03</text><rect x="80.0" y="492.0" width="300.0" height="36.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5" fill-opacity="1"/><text x="230.0" y="516.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">air gap</text><text x="410.0" y="506.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#222222">2.00</text><text x="480.0" y="516.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">≥ 1.80 anywhere (doc 18 §7)</text><rect x="80.0" y="534.0" width="300.0" height="70.0" rx="0" fill="#7d8792" stroke="#222222" stroke-width="1.5" fill-opacity="1"/><text x="230.0" y="575.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="white">stator tooth tips (radius)</text><text x="410.0" y="565.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#222222"></text><text x="480.0" y="575.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">r 299.00</text><rect x="840.0" y="110.0" width="380.0" height="330.0" rx="8" fill="#f3f4f6" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><text x="860.0" y="140.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">Magnet inner face at a block centre:</text><text x="860.0" y="157.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">  nominal r 301.513</text><text x="860.0" y="175.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">  lowest  r 301.49 (thick block, small seat)</text><text x="860.0" y="192.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">  highest r 301.61 (thin block, big seat,</text><text x="860.0" y="210.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">            thick bond)</text><text x="860.0" y="227.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222"></text><text x="860.0" y="245.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">Sleeve 0.49 to 0.61 at the block centre,</text><text x="860.0" y="262.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">up to 0.78 at the block edges: inside</text><text x="860.0" y="280.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">the 0.4 to 0.8 range tested on Q1.</text><text x="860.0" y="297.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222"></text><text x="860.0" y="315.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">Air gap: unchanged, set by the mandrel.</text><rect x="840.0" y="460.0" width="380.0" height="150.0" rx="8" fill="#fff4e6" stroke="#f59f00" stroke-width="2" fill-opacity="1"/><text x="860.0" y="490.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">Reject a drum if the seat is</text><text x="860.0" y="507.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">smaller than Ø618.65: the blocks would</text><text x="860.0" y="525.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">push into the sleeve space.</text><text x="860.0" y="542.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">Larger seat: just thicker sleeve.</text></svg>