<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620"><title>M02 One magnet, two ways round</title><rect width="100%" height="100%" fill="white"/><text x="20.0" y="34.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="start" font-weight="bold" fill="#222222">M02  Why flat is easier: ONE magnet part, turned over for the other pole</text><text x="20.0" y="58.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#6b6b6b">A flat block is magnetised straight through its thickness. Turn it over and the north face points the other way.</text><rect x="20.0" y="80.0" width="560.0" height="500.0" rx="10" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><text x="300.0" y="115.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" text-anchor="middle" font-weight="bold" fill="#222222">Curved arc: 2 kinds to buy</text><path d="M70,250 Q170,205 270,250 L270,290 Q170,245 70,290 Z" fill="#d9463b" stroke="#222222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="170.0" y1="205.0" x2="170.0" y2="300.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/><polygon points="170.0,300.0 164.8,289.2 175.2,289.2" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><text x="170.0" y="340.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">NP1-220-N</text><text x="170.0" y="358.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">north inside</text><path d="M330,250 Q430,205 530,250 L530,290 Q430,245 330,290 Z" fill="#3b6fd1" stroke="#222222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="430.0" y1="300.0" x2="430.0" y2="205.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/><polygon points="430.0,205.0 435.2,215.8 424.8,215.8" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><text x="430.0" y="340.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">NP1-220-S</text><text x="430.0" y="358.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">south inside</text><circle cx="300.0" cy="430.0" r="18.0" fill="#e03131" stroke="none" stroke-width="2"/><line x1="291.9" y1="421.9" x2="308.1" y2="438.1" stroke="white" stroke-width="5.040000000000001" stroke-linecap="round"/><line x1="291.9" y1="438.1" x2="308.1" y2="421.9" stroke="white" stroke-width="5.040000000000001" stroke-linecap="round"/><text x="300.0" y="475.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">turning it over does not work:</text><text x="300.0" y="493.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">the curve then faces the wrong way</text><rect x="620.0" y="80.0" width="560.0" height="500.0" rx="10" fill="white" stroke="#2f9e44" stroke-width="3" fill-opacity="1"/><text x="900.0" y="115.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" text-anchor="middle" font-weight="bold" fill="#222222">Flat block: 1 kind to buy</text><rect x="670.0" y="225.0" width="200.0" height="60.0" rx="3" fill="#d9463b" stroke="#222222" stroke-width="2.5" fill-opacity="1"/><text x="770.0" y="220.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">N face  •</text><text x="770.0" y="305.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">S face</text><line x1="770.0" y1="280.0" x2="770.0" y2="230.0" stroke="white" stroke-width="4" stroke-linecap="round"/><polygon points="770.0,230.0 775.2,240.8 764.8,240.8" fill="white" stroke="white" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><text x="770.0" y="340.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">NP1-220</text><text x="770.0" y="358.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">dot UP = N pole</text><rect x="930.0" y="225.0" width="200.0" height="60.0" rx="3" fill="#3b6fd1" stroke="#222222" stroke-width="2.5" fill-opacity="1"/><text x="1030.0" y="305.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">S face</text><text x="1030.0" y="220.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">N face  •</text><line x1="1030.0" y1="230.0" x2="1030.0" y2="280.0" stroke="white" stroke-width="4" stroke-linecap="round"/><polygon points="1030.0,280.0 1024.8,269.2 1035.2,269.2" fill="white" stroke="white" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><text x="1030.0" y="340.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">NP1-220</text><text x="1030.0" y="358.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">dot DOWN = S pole</text><path d="M830,255 C 860,200 890,200 920,255" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line x1="912.0" y1="240.0" x2="922.0" y2="258.0" stroke="#2f9e44" stroke-width="4" stroke-linecap="round"/><polygon points="922.0,258.0 912.2,251.1 921.3,246.0" fill="#2f9e44" stroke="#2f9e44" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><text x="875.0" y="192.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#2f9e44">turn over</text><circle cx="900.0" cy="430.0" r="18.0" fill="#2f9e44" stroke="none" stroke-width="2"/><path d="M891.0,430.0 L898.2,438.1 L909.9,421.9" fill="none" stroke="white" stroke-width="5.040000000000001" stroke-linejoin="round" stroke-linecap="round"/><text x="900.0" y="475.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">same part for N and S poles,</text><text x="900.0" y="493.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">one stock, one spare box, no mix-ups</text><text x="600.0" y="605.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#6b6b6b">Arrow = direction of magnetisation (from S face to N face, inside the magnet). The white dot marks the N face.</text></svg>