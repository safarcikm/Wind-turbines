<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600"><title>G12 Pot the coil ends</title><rect width="100%" height="100%" fill="white"/><text x="20.0" y="34.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="start" font-weight="bold" fill="#222222">G12  Pour potting around the coil ends (moulds NP1-T08)</text><text x="20.0" y="58.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#6b6b6b">Section through the stator, real size scale. Green = where the potting goes. It must stay inside the dashed lines.</text><polygon points="173.1,430.0 173.1,381.6 364.2,381.6 364.2,357.2 424.0,357.2 424.0,716.0 359.0,716.0 359.0,430.0" fill="#6f7b8a" stroke="#222222" stroke-width="2" stroke-linejoin="round" fill-opacity="1"/><polygon points="151.0,422.2 171.8,422.2 171.8,354.6 151.0,354.6" fill="#d5d9de" stroke="#222222" stroke-width="2" stroke-linejoin="round" fill-opacity="1"/><polygon points="171.8,381.6 364.2,381.6 364.2,172.6 171.8,172.6" fill="#5f6b7a" stroke="#222222" stroke-width="2" stroke-linejoin="round" fill-opacity="1"/><polygon points="83.4,362.4 203.0,362.4 203.0,159.6 83.4,159.6" fill="#f3d9fa" stroke="#da77f2" stroke-width="3" stroke-linejoin="round" fill-opacity="1"/><polygon points="104.2,352.0 182.2,352.0 182.2,175.2 104.2,175.2" fill="#79c37a" stroke="#222222" stroke-width="1.5" stroke-linejoin="round" fill-opacity="1"/><polygon points="114.6,341.6 171.8,341.6 171.8,190.8 114.6,190.8" fill="#d9822b" stroke="#222222" stroke-width="1.5" stroke-linejoin="round" fill-opacity="1"/><polygon points="104.2,352.0 182.2,352.0 182.2,175.2 104.2,175.2" fill="none" stroke="#e03131" stroke-width="2" stroke-linejoin="round" fill-opacity="1" stroke-dasharray="8,5"/><polygon points="333.0,362.4 452.6,362.4 452.6,159.6 333.0,159.6" fill="#f3d9fa" stroke="#da77f2" stroke-width="3" stroke-linejoin="round" fill-opacity="1"/><polygon points="353.8,352.0 431.8,352.0 431.8,175.2 353.8,175.2" fill="#79c37a" stroke="#222222" stroke-width="1.5" stroke-linejoin="round" fill-opacity="1"/><polygon points="364.2,341.6 421.4,341.6 421.4,190.8 364.2,190.8" fill="#d9822b" stroke="#222222" stroke-width="1.5" stroke-linejoin="round" fill-opacity="1"/><polygon points="353.8,352.0 431.8,352.0 431.8,175.2 353.8,175.2" fill="none" stroke="#e03131" stroke-width="2" stroke-linejoin="round" fill-opacity="1" stroke-dasharray="8,5"/><polygon points="171.8,381.6 364.2,381.6 364.2,172.6 171.8,172.6" fill="#5f6b7a" stroke="#222222" stroke-width="2" stroke-linejoin="round" fill-opacity="1"/><line x1="60.0" y1="172.6" x2="502.0" y2="172.6" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4,4"/><text x="507.2" y="177.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#222222">Ø598 limit</text><line x1="127.6" y1="268.8" x2="70.0" y2="140.0" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><circle cx="127.6" cy="268.8" r="3.0" fill="#222222" stroke="#222222" stroke-width="1"/><text x="74.0" y="145.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">front coil ends (x 321–343)</text><line x1="392.8" y1="268.8" x2="640.0" y2="185.0" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><circle cx="392.8" cy="268.8" r="3.0" fill="#222222" stroke="#222222" stroke-width="1"/><text x="644.0" y="190.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">rear coil ends + joints (x 417–439)</text><line x1="413.6" y1="180.4" x2="640.0" y2="240.0" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><circle cx="413.6" cy="180.4" r="3.0" fill="#222222" stroke="#222222" stroke-width="1"/><text x="644.0" y="245.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">potting (green), 4 mm all round</text><line x1="450.0" y1="248.0" x2="640.0" y2="295.0" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><circle cx="450.0" cy="248.0" r="3.0" fill="#222222" stroke="#222222" stroke-width="1"/><text x="644.0" y="300.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">silicone mould (pink)</text><line x1="268.0" y1="274.0" x2="640.0" y2="350.0" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><circle cx="268.0" cy="274.0" r="3.0" fill="#222222" stroke="#222222" stroke-width="1"/><text x="644.0" y="355.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">stack: no potting on the tooth tips</text><line x1="398.0" y1="534.0" x2="640.0" y2="460.0" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><circle cx="398.0" cy="534.0" r="3.0" fill="#222222" stroke="#222222" stroke-width="1"/><text x="644.0" y="465.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">carrier: keep clean</text><rect x="870.0" y="380.0" width="315.0" height="200.0" rx="8" fill="#f3f4f6" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><text x="885.0" y="410.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">1  Warm the stator to 60 °C.</text><text x="885.0" y="427.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">2  Fit both moulds.</text><text x="885.0" y="445.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">3  Mix, then degas under vacuum.</text><text x="885.0" y="462.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">4  Pour slowly from ONE point.</text><text x="885.0" y="480.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">5  Cure with slow heating (≤ 1 K/min).</text><text x="885.0" y="497.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">6  Demould. Look for holes and cracks.</text></svg>