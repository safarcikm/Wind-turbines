e-linecap="round"/><line x1="404.2" y1="192.6" x2="525.8" y2="192.6" stroke="#3b6fd1" stroke-width="6" stroke-linecap="round"/><line x1="222.0" y1="296.8" x2="222.0" y2="367.0" stroke="#3b6fd1" stroke-width="6" stroke-linecap="round"/><line x1="110.0" y1="477.7" x2="200.0" y2="570.0" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><circle cx="110.0" cy="477.7" r="3.0" fill="#222222" stroke="#222222" stroke-width="1"/><text x="204.0" y="575.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">front cup seat Ø210 P7</text><line x1="438.0" y1="477.7" x2="560.0" y2="570.0" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><circle cx="438.0" cy="477.7" r="3.0" fill="#222222" stroke="#222222" stroke-width="1"/><text x="564.0" y="575.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">rear cup seat Ø210 P7</text><line x1="465.0" y1="192.6" x2="700.0" y2="130.0" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><circle cx="465.0" cy="192.6" r="3.0" fill="#222222" stroke="#222222" stroke-width="1"/><text x="704.0" y="135.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">MAGNET SEAT Ø618.4 (+0.05/0)</text><text x="704.0" y="154.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">run-out ≤ 0.02 to the cup seats</text><line x1="222.0" y1="326.5" x2="420.0" y2="400.0" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><circle cx="222.0" cy="326.5" r="3.0" fill="#222222" stroke="#222222" stroke-width="1"/><text x="424.0" y="405.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">hub face + Ø360 spigot</text><text x="424.0" y="424.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">12 × M16 on PCD 400</text><line x1="570.3" y1="151.0" x2="700.0" y2="220.0" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><circle cx="570.3" cy="151.0" r="3.0" fill="#222222" stroke="#222222" stroke-width="1"/><text x="704.0" y="225.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">rear flange ring Ø710:</text><text x="704.0" y="244.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">disc + rear cover bolts</text><rect x="820.0" y="300.0" width="360.0" height="150.0" rx="8" fill="#f3f4f6" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><text x="835.0" y="330.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">Before machining: weld, check (MT/UT),</text><text x="835.0" y="348.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">stress relieve 580–620 °C.</text><text x="835.0" y="367.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">Rough, rest 24 h, then finish.</text><text x="835.0" y="386.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">Measure the magnet seat at</text><text x="835.0" y="405.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">3 depths × 8 angles. Write it down.</text></svg>