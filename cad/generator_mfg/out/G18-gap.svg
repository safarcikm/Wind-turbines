<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560"><title>G18 Check the air gap</title><rect width="100%" height="100%" fill="white"/><text x="20.0" y="34.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="start" font-weight="bold" fill="#222222">G18  Check the air gap at 8 places × 2 ends (brass or plastic feelers only)</text><circle cx="300.0" cy="300.0" r="230.0" fill="#b9c0c8" stroke="#222222" stroke-width="3"/><circle cx="300.0" cy="300.0" r="200.0" fill="#d9463b" stroke="#222222" stroke-width="1.5"/><circle cx="300.0" cy="300.0" r="196.0" fill="white" stroke="#222222" stroke-width="1"/><circle cx="300.0" cy="300.0" r="180.0" fill="#5f6b7a" stroke="#222222" stroke-width="2"/><circle cx="300.0" cy="300.0" r="70.0" fill="#8a95a5" stroke="#222222" stroke-width="2"/><circle cx="300.0" cy="110.0" r="13.0" fill="#d4b24c" stroke="white" stroke-width="2"/><text x="300.0" y="114.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14.3" text-anchor="middle" font-weight="bold" fill="white">1</text><circle cx="434.4" cy="165.6" r="13.0" fill="#d4b24c" stroke="white" stroke-width="2"/><text x="434.4" y="170.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14.3" text-anchor="middle" font-weight="bold" fill="white">2</text><circle cx="490.0" cy="300.0" r="13.0" fill="#d4b24c" stroke="white" stroke-width="2"/><text x="490.0" y="304.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14.3" text-anchor="middle" font-weight="bold" fill="white">3</text><circle cx="434.4" cy="434.4" r="13.0" fill="#d4b24c" stroke="white" stroke-width="2"/><text x="434.4" y="439.3" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14.3" text-anchor="middle" font-weight="bold" fill="white">4</text><circle cx="300.0" cy="490.0" r="13.0" fill="#d4b24c" stroke="white" stroke-width="2"/><text x="300.0" y="494.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14.3" text-anchor="middle" font-weight="bold" fill="white">5</text><circle cx="165.6" cy="434.4" r="13.0" fill="#d4b24c" stroke="white" stroke-width="2"/><text x="165.6" y="439.3" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14.3" text-anchor="middle" font-weight="bold" fill="white">6</text><circle cx="110.0" cy="300.0" r="13.0" fill="#d4b24c" stroke="white" stroke-width="2"/><text x="110.0" y="304.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14.3" text-anchor="middle" font-weight="bold" fill="white">7</text><circle cx="165.6" cy="165.6" r="13.0" fill="#d4b24c" stroke="white" stroke-width="2"/><text x="165.6" y="170.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14.3" text-anchor="middle" font-weight="bold" fill="white">8</text><text x="300.0" y="306.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="white">rear view</text><rect x="620.0" y="90.0" width="560.0" height="300.0" rx="8" fill="#f3f4f6" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><text x="640.0" y="125.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#222222">1  Look through the inspection port.</text><text x="640.0" y="146.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#222222">2  Slide a brass feeler between the sleeve</text><text x="640.0" y="167.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#222222">    and a tooth tip. Write the size.</text><text x="640.0" y="188.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#222222">3  Turn the rotor 45°, repeat to 8.</text><text x="640.0" y="210.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#222222">4  Do it at the front end and rear end.</text><text x="640.0" y="231.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#222222"></text><text x="640.0" y="252.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#222222">Every reading:      ≥ 1.80 mm</text><text x="640.0" y="273.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#222222">Biggest − smallest:  ≤ 0.20 mm</text><circle cx="1120.0" cy="330.0" r="14.0" fill="#2f9e44" stroke="none" stroke-width="2"/><path d="M1113.0,330.0 L1118.6,336.3 L1127.7,323.7" fill="none" stroke="white" stroke-width="3.9200000000000004" stroke-linejoin="round" stroke-linecap="round"/><rect x="620.0" y="410.0" width="560.0" height="120.0" rx="8" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><text x="650.0" y="440.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">pos</text><text x="650.0" y="475.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#222222">front</text><text x="650.0" y="505.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#222222">rear</text><text x="710.0" y="440.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">1</text><text x="710.0" y="475.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#222222">____</text><text x="710.0" y="505.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#222222">____