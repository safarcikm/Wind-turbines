ried by</text><line x1="650.0" y1="150.0" x2="1280.0" y2="150.0" stroke="#c9ced6" stroke-width="1" stroke-linecap="round"/><text x="662.0" y="178.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222222">Spinning at 250 rpm (overspeed)</text><text x="920.0" y="178.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">38 N outwards</text><text x="1105.0" y="178.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222222">drum steel</text><line x1="650.0" y1="196.0" x2="1280.0" y2="196.0" stroke="#c9ced6" stroke-width="1" stroke-linecap="round"/><text x="662.0" y="224.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222222">Magnetic pull, no load</text><text x="920.0" y="224.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">37 N outwards</text><text x="1105.0" y="224.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222222">drum steel</text><line x1="650.0" y1="242.0" x2="1280.0" y2="242.0" stroke="#c9ced6" stroke-width="1" stroke-linecap="round"/><text x="662.0" y="270.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222222">Magnetic pull, rated load</text><text x="920.0" y="270.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">131 N outwards</text><text x="1105.0" y="270.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222222">drum steel</text><line x1="650.0" y1="288.0" x2="1280.0" y2="288.0" stroke="#c9ced6" stroke-width="1" stroke-linecap="round"/><text x="662.0" y="316.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222222">Torque share, rated (local peak)</text><text x="920.0" y="316.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">85 N sideways</text><text x="1105.0" y="316.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222222">glue shear, comb bar</text><line x1="650.0" y1="334.0" x2="1280.0" y2="334.0" stroke="#c9ced6" stroke-width="1" stroke-linecap="round"/><text x="662.0" y="362.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222222">Short circuit, 4 × torque</text><text x="920.0" y="362.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">≈ 264 N sideways</text><text x="1105.0" y="362.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222222">glue shear, comb bar</text><line x1="650.0" y1="380.0" x2="1280.0" y2="380.0" stroke="#c9ced6" stroke-width="1" stroke-linecap="round"/><text x="662.0" y="408.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222222">Cold −40 °C (steel shrinks more)</text><text x="920.0" y="408.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">≈ 0.02 mm at corners</text><text x="1105.0" y="408.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222222">tough room-cure glue</text><line x1="650.0" y1="426.0" x2="1280.0" y2="426.0" stroke="#c9ced6" stroke-width="1" stroke-linecap="round"/><text x="662.0" y="454.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222222">If a block ever cracks</text><text x="920.0" y="454.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">pieces stay put</text><text x="1105.0" y="454.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222222">sleeve + end rings</text><rect x="650.0" y="520.0" width="630.0" height="140.0" rx="8" fill="#f3f4f6" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><text x="664.0" y="548.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">Glue area per pole 3200 mm². Rated shear 26 kPa,</text><text x="664.0" y="565.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">short circuit ≈ 82 kPa, against ≥ 5 MPa at 120 °C:</text><text x="664.0" y="583.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">more than 50× margin. The glue never carries a pull-off load,</text><text x="664.0" y="600.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">so a block cannot fall into the air gap even with no glue.</text></svg>