<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"><title>MI01 The magnet block in 3D</title><rect width="100%" height="100%" fill="white"/><text x="20.0" y="34.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="start" font-weight="bold" fill="#222222">MI01  The magnet block NP1-220 Rev D in 3D (isometric, 8× real size)</text><text x="20.0" y="58.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#6b6b6b">One part for every pole. The arrow shows the magnetisation, from the S face to the N face.</text><path d="M486.7,117.9 L860.0,333.5 L673.3,441.2 L300.0,225.7 Z " fill="#da4b40" fill-rule="evenodd" stroke="#da4b40" stroke-width="0.7" stroke-linejoin="round"/><path d="M486.7,117.9 L860.0,333.5 L673.3,441.2 L300.0,225.7 L486.7,117.9 " fill="none" stroke="#2b2b2b" stroke-width="1.1" stroke-linecap="round"/><path d="M673.3,522.1 L300.0,306.5 L300.0,225.7 L673.3,441.2 Z " fill="#ac372e" fill-rule="evenodd" stroke="#ac372e" stroke-width="0.7" stroke-linejoin="round"/><path d="M673.3,522.1 L300.0,306.5 M673.3,441.2 L300.0,225.7 M673.3,522.1 L673.3,441.2 M300.0,306.5 L300.0,225.7 " fill="none" stroke="#2b2b2b" stroke-width="1.1" stroke-linecap="round"/><path d="M860.0,414.3 L673.3,522.1 L673.3,441.2 L860.0,333.5 Z " fill="#862b24" fill-rule="evenodd" stroke="#862b24" stroke-width="0.7" stroke-linejoin="round"/><path d="M860.0,414.3 L673.3,522.1 M860.0,333.5 L673.3,441.2 M860.0,414.3 L860.0,333.5 M673.3,522.1 L673.3,441.2 " fill="none" stroke="#2b2b2b" stroke-width="1.1" stroke-linecap="round"/><circle cx="692.0" cy="322.7" r="8.0" fill="white" stroke="#222222" stroke-width="1.5"/><line x1="692.0" y1="322.7" x2="980.0" y2="170.0" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><circle cx="692.0" cy="322.7" r="3.0" fill="#222222" stroke="#222222" stroke-width="1"/><text x="984.0" y="175.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">white dot = N face</text><text x="984.0" y="194.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">(here facing up)</text><line x1="300.0" y1="336.5" x2="673.3" y2="552.1" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><polygon points="300.0,336.5 308.9,337.6 305.4,343.7" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><polygon points="673.3,552.1 664.4,551.0 667.9,544.9" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><g transform="translate(486.7,444.3) rotate(30.0)"><rect x="-26.2" y="-12.8" width="52.5" height="17.2" rx="0" fill="white" stroke="none" stroke-width="0" fill-opacity="1"/><text x="0.0" y="0.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">40.00</text></g><line x1="703.3" y1="522.1" x2="890.0" y2="414.3" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><polygon points="703.3,522.1 708.8,514.9 712.3,521.0" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><polygon points="890.0,414.3 884.6,421.5 881.1,415.4" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><g transform="translate(796.7,468.2) rotate(-30.0)"><rect x="-26.2" y="-12.8" width="52.5" height="17.2" rx="0" fill="white" stroke="none" stroke-width="0" fill-opacity="1"/><text x="0.0" y="0.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">20.00</text></g><line x1="266.0" y1="306.5" x2="266.0" y2="225.7" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><polygon points="266.0,306.5 262.5,298.2 269.5,298.2" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><polygon points="266.0,225.7 269.5,234.0 262.5,234.0" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><g transform="translate(266.0,266.1) rotate(-90.0)"><rect x="-21.6" y="-12.8" width="43.2" height="17.2" rx="0" fill="white" stroke="none" stroke-width="0" fill-opacity="1"/><text x="0.0" y="0.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">7.50</text></g><line x1="524.0" y1="247.3" x2="524.0" y2="117.3" stroke="#2f9e44" stroke-width="6" stroke-linecap="round"/><polygon points="524.0,117.3 531.8,133.5 516.2,133.5" fill="#2f9e44" stroke="#2f9e44" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><text x="538.0" y="137.3" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#2f9e44">magnetisation: out of the N face</text><rect x="30.0" y="560.0" width="1140.0" height="110.0" rx="8" fill="#f3f4f6" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><text x="50.0" y="592.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">N40EH or N40UH, 46 g, 40 × 20 face like a small domino. Pulls ≈ 280 N (28 kg) on thick steel.</text><text x="50.0" y="610.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">Flat faces ground, edges chamfered 0.2 to 0.3, NiCuNi + epoxy coated, white dot on the N face.</text><text x="50.0" y="629.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">160 per generator (+8 spare): 40 poles × 2 across × 2 along.</text></svg>