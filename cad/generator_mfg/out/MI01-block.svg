<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"><title>MI01 The magnet block in 3D</title><rect width="100%" height="100%" fill="white"/><text x="20.0" y="34.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="start" font-weight="bold" fill="#222222">MI01  The magnet block NP1-220 Rev C in 3D (isometric, 8× real size)</text><text x="20.0" y="58.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#6b6b6b">One part for every pole. The arrow shows the magnetisation, from the S face to the N face.</text><path d="M488.7,110.7 L860.0,325.1 L671.3,434.0 L300.0,219.6 Z " fill="#da4b40" fill-rule="evenodd" stroke="#da4b40" stroke-width="0.7" stroke-linejoin="round"/><path d="M488.7,110.7 L860.0,325.1 L671.3,434.0 L300.0,219.6 L488.7,110.7 " fill="none" stroke="#2b2b2b" stroke-width="1.1" stroke-linecap="round"/><path d="M671.3,529.3 L300.0,314.9 L300.0,219.6 L671.3,434.0 Z " fill="#ac372e" fill-rule="evenodd" stroke="#ac372e" stroke-width="0.7" stroke-linejoin="round"/><path d="M671.3,529.3 L300.0,314.9 M671.3,434.0 L300.0,219.6 M671.3,529.3 L671.3,434.0 M300.0,314.9 L300.0,219.6 " fill="none" stroke="#2b2b2b" stroke-width="1.1" stroke-linecap="round"/><path d="M860.0,420.4 L671.3,529.3 L671.3,434.0 L860.0,325.1 Z " fill="#862b24" fill-rule="evenodd" stroke="#862b24" stroke-width="0.7" stroke-linejoin="round"/><path d="M860.0,420.4 L671.3,529.3 M860.0,325.1 L671.3,434.0 M860.0,420.4 L860.0,325.1 M671.3,529.3 L671.3,434.0 " fill="none" stroke="#2b2b2b" stroke-width="1.1" stroke-linecap="round"/><circle cx="691.7" cy="315.1" r="8.0" fill="white" stroke="#222222" stroke-width="1.5"/><line x1="691.7" y1="315.1" x2="980.0" y2="170.0" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><circle cx="691.7" cy="315.1" r="3.0" fill="#222222" stroke="#222222" stroke-width="1"/><text x="984.0" y="175.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">white dot = N face</text><text x="984.0" y="194.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">(here facing up)</text><line x1="300.0" y1="344.9" x2="671.3" y2="559.3" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><polygon points="300.0,344.9 308.9,346.0 305.4,352.1" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><polygon points="671.3,559.3 662.4,558.2 665.9,552.1" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><g transform="translate(485.7,452.1) rotate(30.0)"><rect x="-26.2" y="-12.8" width="52.5" height="17.2" rx="0" fill="white" stroke="none" stroke-width="0" fill-opacity="1"/><text x="0.0" y="0.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">36.90</text></g><line x1="701.3" y1="529.3" x2="890.0" y2="420.4" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><polygon points="701.3,529.3 706.7,522.1 710.3,528.2" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><polygon points="890.0,420.4 884.6,427.5 881.1,421.5" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><g transform="translate(795.7,474.8) rotate(-30.0)"><rect x="-26.2" y="-12.8" width="52.5" height="17.2" rx="0" fill="white" stroke="none" stroke-width="0" fill-opacity="1"/><text x="0.0" y="0.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">18.75</text></g><line x1="266.0" y1="314.9" x2="266.0" y2="219.6" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><polygon points="266.0,314.9 262.5,306.6 269.5,306.6" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><polygon points="266.0,219.6 269.5,227.9 262.5,227.9" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><g transform="translate(266.0,267.3) rotate(-90.0)"><rect x="-21.6" y="-12.8" width="43.2" height="17.2" rx="0" fill="white" stroke="none" stroke-width="0" fill-opacity="1"/><text x="0.0" y="0.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">8.20</text></g><line x1="524.3" y1="240.2" x2="524.3" y2="110.2" stroke="#2f9e44" stroke-width="6" stroke-linecap="round"/><polygon points="524.3,110.2 532.1,126.4 516.5,126.4" fill="#2f9e44" stroke="#2f9e44" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><text x="538.3" y="130.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#2f9e44">magnetisation: out of the N face</text><rect x="30.0" y="560.0" width="1140.0" height="110.0" rx="8" fill="#f3f4f6" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><text x="50.0" y="592.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">N40UH, 43 g, size of a matchbox cut in half. Pulls ≈ 280 N (28 kg) on thick steel.</text><text x="50.0" y="610.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">Flat faces ground, edges chamfered 0.2 to 0.3, NiCuNi + epoxy coated, white dot on the N face.</text><text x="50.0" y="629.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">160 per generator (+8 spare): 40 poles × 2 across × 2 along.</text></svg>