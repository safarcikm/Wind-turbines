<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680"><title>G16 Mould the sleeve</title><rect width="100%" height="100%" fill="white"/><text x="20.0" y="34.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="start" font-weight="bold" fill="#222222">G16  Mould the glass sleeve over the magnets (mandrel NP1-T06)</text><text x="20.0" y="58.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#6b6b6b">The aluminium mandrel sits in both bearing seats, so the sleeve comes out perfectly round and centred.</text><polygon points="128.0,432.5 203.8,432.5 203.8,443.0 496.2,443.0 496.2,432.5 567.5,432.5 567.5,410.0 470.0,410.0 470.0,422.0 327.5,422.0 290.0,422.0 230.0,422.0 230.0,410.0 128.0,410.0" fill="#b9c0c8" stroke="#222222" stroke-width="2" stroke-linejoin="round" fill-opacity="1"/><polygon points="282.5,422.0 282.5,320.0 290.0,320.0 290.0,242.0 320.0,242.0 320.0,422.0" fill="#b9c0c8" stroke="#222222" stroke-width="2" stroke-linejoin="round" fill-opacity="1"/><polygon points="308.0,242.0 320.0,242.0 320.0,122.0 308.0,122.0" fill="#b9c0c8" stroke="#222222" stroke-width="2" stroke-linejoin="round" fill-opacity="1"/><polygon points="308.0,122.0 492.5,122.0 492.5,126.2 627.5,126.2 627.5,122.0 666.5,122.0 666.5,113.0 627.5,113.0 627.5,105.5 492.5,105.5 492.5,113.0 308.0,113.0" fill="#b9c0c8" stroke="#222222" stroke-width="2" stroke-linejoin="round" fill-opacity="1"/><polygon points="666.5,122.0 687.5,122.0 687.5,57.5 666.5,57.5" fill="#b9c0c8" stroke="#222222" stroke-width="2" stroke-linejoin="round" fill-opacity="1"/><polygon points="504.5,137.8 615.5,137.8 615.5,126.2 504.5,126.2" fill="#d9463b" stroke="#222222" stroke-width="2" stroke-linejoin="round" fill-opacity="1"/><polygon points="492.5,137.8 504.5,137.8 504.5,126.2 492.5,126.2" fill="#e6cf9f" stroke="#222222" stroke-width="2" stroke-linejoin="round" fill-opacity="1"/><polygon points="615.5,137.8 627.5,137.8 627.5,126.2 615.5,126.2" fill="#e6cf9f" stroke="#222222" stroke-width="2" stroke-linejoin="round" fill-opacity="1"/><polygon points="485.0,192.5 638.0,192.5 638.0,138.5 485.0,138.5" fill="#cfe4f5" stroke="#222222" stroke-width="2" stroke-linejoin="round" fill-opacity="1"/><polygon points="623.0,425.0 638.0,425.0 638.0,192.5 623.0,192.5" fill="#cfe4f5" stroke="#222222" stroke-width="2" stroke-linejoin="round" fill-opacity="1"/><polygon points="500.0,500.0 638.0,500.0 638.0,425.0 567.5,425.0 567.5,432.6 500.0,432.6" fill="#cfe4f5" stroke="#222222" stroke-width="2" stroke-linejoin="round" fill-opacity="1"/><polygon points="128.0,560.0 203.0,560.0 203.0,432.6 128.0,432.6" fill="#cfe4f5" stroke="#222222" stroke-width="2" stroke-linejoin="round" fill-opacity="1"/><polygon points="117.5,590.0 650.0,590.0 650.0,560.0 117.5,560.0" fill="#7d8792" stroke="#222222" stroke-width="2" stroke-linejoin="round" fill-opacity="1"/><polygon points="492.5,138.5 627.5,138.5 627.5,137.8 492.5,137.8" fill="#79c37a" stroke="#79c37a" stroke-width="3" stroke-linejoin="round" fill-opacity="1"/><line x1="80.0" y1="590.0" x2="710.0" y2="590.0" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="18,6,4,6"/><line x1="560.0" y1="138.2" x2="820.0" y2="165.0" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><circle cx="560.0" cy="138.2" r="3.0" fill="#222222" stroke="#222222" stroke-width="1"/><text x="824.0" y="170.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">glass sleeve 0.4–0.6 mm</text><text x="824.0" y="189.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">inner Ø602.0</text><line x1="560.0" y1="132.5" x2="820.0" y2="120.0" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><circle cx="560.0" cy="132.5" r="3.0" fill="#222222" stroke="#222222" stroke-width="1"/><text x="824.0" y="125.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">magnets</text><line x1="630.5" y1="290.0" x2="820.0" y2="220.0" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><circle cx="630.5" cy="290.0" r="3.0" fill="#222222" stroke="#222222" stroke-width="1"/><text x="824.0" y="225.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">aluminium mandrel</text><text x="824.0" y="244.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">(not magnetic: no pull)</text><line x1="165.5" y1="470.0" x2="820.0" y2="370.0" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><circle cx="165.5" cy="470.0" r="3.0" fill="#222222" stroke="#222222" stroke-width="1"/><text x="824.0" y="375.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">front plug in the FRONT cup seat</text><text x="824.0" y="394.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">(fitted from the front)</text><line x1="533.0" y1="455.0" x2="820.0" y2="425.0" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><circle cx="533.0" cy="455.0" r="3.0" fill="#222222" stroke="#222222" stroke-width="1"/><text x="824.0" y="430.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">spigot in the REAR cup seat</text><line x1="440.0" y1="575.0" x2="820.0" y2="300.0" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><circle cx="440.0" cy="575.0" r="3.0" fill="#222222" stroke="#222222" stroke-width="1"/><text x="824.0" y="305.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">tie rod joins plug and mandrel</text><rect x="820.0" y="470.0" width="360.0" height="160.0" rx="8" fill="#f3f4f6" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><text x="832.0" y="492.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222222">1  Wrap dry glass cloth on the mandrel.</text><text x="832.0" y="509.3" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222222">2  Lower it in from the rear; fit the front</text><text x="832.0" y="526.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222222">    plug from the front, tighten the tie rod.</text><text x="832.0" y="543.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222222">3  Seal the ends, suck the resin in from</text><text x="832.0" y="561.1" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222222">    the bottom until it comes out clear.</text><text x="832.0" y="578.4" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222222">4  24 h room temp, then 80 °C for 4 h.</text><text x="832.0" y="595.7" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222222">5  Cool: aluminium shrinks more, the</text><text x="832.0" y="613.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222222">    mandrel comes out by itself.</text><text x="832.0" y="630.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222222">6  Trim. NEVER grind the rotor.</text></svg>