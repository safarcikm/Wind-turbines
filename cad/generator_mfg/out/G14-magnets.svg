<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"><title>G14 Magnets and their places</title><rect width="100%" height="100%" fill="white"/><text x="20.0" y="34.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="start" font-weight="bold" fill="#222222">G14  The magnets: two kinds, and where each one goes</text><text x="20.0" y="58.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#6b6b6b">The drum seat is shown unrolled flat, looking from the stator side (as the stator sees it).</text><path d="M40,200 Q140,160 240,200 L240,230 Q140,190 40,230 Z" fill="#d9463b" stroke="#222222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="140.0" cy="185.0" r="7.0" fill="#d9463b" stroke="white" stroke-width="3"/><text x="140.0" y="260.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">NP1-220-N</text><text x="140.0" y="278.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">north on the inside</text><text x="140.0" y="297.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">RED dot</text><text x="140.0" y="150.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b6b6b">convex side (to drum) ↑</text><path d="M340,200 Q440,160 540,200 L540,230 Q440,190 340,230 Z" fill="#3b6fd1" stroke="#222222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="440.0" cy="185.0" r="7.0" fill="#3b6fd1" stroke="white" stroke-width="3"/><text x="440.0" y="260.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">NP1-220-S</text><text x="440.0" y="278.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">south on the inside</text><text x="440.0" y="297.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">BLUE dot</text><text x="440.0" y="150.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b6b6b">convex side (to drum) ↑</text><rect x="640.0" y="110.0" width="520.0" height="160.0" rx="8" fill="#fff3bf" stroke="#f59f00" stroke-width="2" fill-opacity="1"/><polygon points="670.0,135.2 687.0,164.8 653.0,164.8" fill="#f59f00" stroke="#222222" stroke-width="2" stroke-linejoin="round" fill-opacity="1"/><text x="670.0" y="161.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="21.08" text-anchor="middle" font-weight="bold" fill="#222222">!</text><text x="700.0" y="145.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">A curved magnet cannot be turned over:</text><text x="700.0" y="163.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">it only fits one way round.</text><text x="700.0" y="182.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">So we order two kinds: 84 N + 84 S.</text><text x="700.0" y="201.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">Check the dot colour before every piece.</text><text x="40.0" y="330.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#222222">Unrolled seat (part of it: 6 of the 40 poles)</text><rect x="60.0" y="350.0" width="26.0" height="260.0" rx=