width="2"/><circle cx="582.8" cy="481.4" r="8.5" fill="white" stroke="#3b6fd1" stroke-width="2"/><text x="600.0" y="582.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#d9463b">day 1: red</text><text x="600.0" y="606.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#3b6fd1">day 2: blue</text><rect x="800.0" y="440.0" width="380.0" height="340.0" rx="10" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><rect x="800.0" y="722.0" width="380.0" height="58.0" rx="0" fill="#f3f4f6" stroke="none" stroke-width="0" fill-opacity="1"/><line x1="800.0" y1="722.0" x2="1180.0" y2="722.0" stroke="#c9ced6" stroke-width="1.5" stroke-linecap="round"/><circle cx="822.0" cy="462.0" r="17.0" fill="#222222" stroke="white" stroke-width="2"/><text x="822.0" y="468.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18.700000000000003" text-anchor="middle" font-weight="bold" fill="white">6</text><text x="990.0" y="746.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Check each pole with the gaussmeter</text><text x="990.0" y="765.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">before the glue gets hard</text><rect x="870.0" y="500.0" width="30.0" height="220.0" rx="0" fill="#b9c0c8" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="900.0" y="570.0" width="6.0" height="150.0" rx="0" fill="#e6cf9f" stroke="#222222" stroke-width="1" fill-opacity="1"/><rect x="860.0" y="720.0" width="120.0" height="14.0" rx="3" fill="#6b6b6b" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="902.0" y="645.0" width="24.0" height="42.0" rx="3" fill="#d9463b" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="902.0" y="599.0" width="24.0" height="42.0" rx="3" fill="#d9463b" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="902.0" y="553.0" width="24.0" height="42.0" rx="3" fill="#d9463b" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="902.0" y="507.0" width="24.0" height="42.0" rx="3" fill="#d9463b" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="970.0" y="560.0" width="70.0" height="100.0" rx="8" fill="#ffe066" stroke="#222222" stroke-width="2" fill-opacity="1"/><text x="1005.0" y="605.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" font-weight="bold" fill="#222222">N</text><line x1="970.0" y1="610.0" x2="932.0" y2="610.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/><circle cx="1100.0" cy="610.0" r="14.0" fill="#2f9e44" stroke="none" stroke-width="2"/><path d="M1093.0,610.0 L1098.6,616.3 L1107.7,603.7" fill="none" stroke="white" stroke-width="3.9200000000000004" stroke-linejoin="round" stroke-linecap="round"/><rect x="20.0" y="800.0" width="1160.0" height="80.0" rx="8" fill="#fff3bf" stroke="#f59f00" stroke-width="2" fill-opacity="1"/><text x="40.0" y="830.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">After all 40 poles: rear end ring, then warm the whole drum to 80 °C for 4 hours (slow heating).</text><text x="40.0" y="848.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">Then scan every pole (section 6.6). Chipped magnet = scrap it in the oil tin, never glue chips.</text></svg>