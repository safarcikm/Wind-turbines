<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"><title>G15 Put a magnet in</title><rect width="100%" height="100%" fill="white"/><text x="20.0" y="34.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="start" font-weight="bold" fill="#222222">G15  Put the magnets in with the jig (NP1-T02). Two people. Never by hand.</text><text x="20.0" y="58.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#6b6b6b">The drum stands upright, open (rear) end up, on the non-magnetic turntable.</text><rect x="20.0" y="80.0" width="380.0" height="340.0" rx="10" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><rect x="20.0" y="362.0" width="380.0" height="58.0" rx="0" fill="#f3f4f6" stroke="none" stroke-width="0" fill-opacity="1"/><line x1="20.0" y1="362.0" x2="400.0" y2="362.0" stroke="#c9ced6" stroke-width="1.5" stroke-linecap="round"/><circle cx="42.0" cy="102.0" r="17.0" fill="#222222" stroke="white" stroke-width="2"/><text x="42.0" y="108.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18.700000000000003" text-anchor="middle" font-weight="bold" fill="white">1</text><text x="210.0" y="386.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Thin glue on the seat AND on the</text><text x="210.0" y="405.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">magnet's curved face (with beads)</text><rect x="90.0" y="140.0" width="30.0" height="220.0" rx="0" fill="#b9c0c8" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="120.0" y="210.0" width="6.0" height="150.0" rx="0" fill="#e6cf9f" stroke="#222222" stroke-width="1" fill-opacity="1"/><rect x="80.0" y="360.0" width="120.0" height="14.0" rx="3" fill="#6b6b6b" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="120.0" y="210.0" width="5.0" height="150.0" rx="0" fill="#79c37a" stroke="none" stroke-width="2" fill-opacity="1"/><rect x="230.0" y="230.0" width="30.0" height="80.0" rx="3" fill="#d9463b" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="226.0" y="230.0" width="5.0" height="80.0" rx="0" fill="#79c37a" stroke="none" stroke-width="2" fill-opacity="1"/><text x="310.0" y="230.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#222222">0.15 mm</text><text x="310.0" y="250.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222">glass beads</text><text x="310.0" y="270.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222">in the glue</text><rect x="410.0" y="80.0" width="380.0" height="340.0" rx="10" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><rect x="410.0" y="362.0" width="380.0" height="58.0" rx="0" fill="#f3f4f6" stroke="none" stroke-width="0" fill-opacity="1"/><line x1="410.0" y1="362.0" x2="790.0" y2="362.0" stroke="#c9ced6" stroke-width="1.5" stroke-linecap="round"/><circle cx="432.0" cy="102.0" r="17.0" fill="#222222" stroke="white" stroke-width="2"/><text x="432.0" y="108.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18.700000000000003" text-anchor="middle" font-weight="bold" fill="white">2</text><text x="600.0" y="386.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">The jig holds the magnet 5 mm away</text><text x="600.0" y="405.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">and slides it DOWN the channel</text><rect x="480.0" y="140.0" width="30.0" height="220.0" rx="0" fill="#b9c0c8" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="510.0" y="210.0" width="6.0" height="150.0" rx="0" fill="#e6cf9f" stroke="#222222" stroke-width="1" fill-opacity="1"/><rect x="470.0" y="360.0" width="120.0" height="14.0" rx="3" fill="#6b6b6b" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="560.0" y="120.0" width="90.0" height="230.0" rx="0" fill="#cfe4f5" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="518.0" y="190.0" width="42.0" height="70.0" rx="0" fill="#e9ecef" stroke="#222222" stroke-width="1.5" fill-opacity="1"/><rect x="522.0" y="195.0" width="24.0" height="60.0" rx="3" fill="#d9463b" stroke="#222222" stroke-width="2" fill-opacity="1"/><line x1="510.0" y1="175.0" x2="522.0" y2="175.0" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round"/><polygon points="510.0,175.0 518.3,171.5 518.3,178.5" fill="#6b6b6b" stroke="#6b6b6b" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><polygon points="522.0,175.0 513.7,178.5 513.7,171.5" fill="#6b6b6b" stroke="#6b6b6b" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><g transform="translate(516.0,175.0) rotate(0.0)"><rect x="-6.7" y="-10.2" width="13.4" height="13.8" rx="0" fill="white" stroke="none" stroke-width="0" fill-opacity="1"/><text x="0.0" y="0.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#6b6b6b">5</text></g><line x1="680.0" y1="170.0" x2="680.0" y2="280.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/><polygon points="680.0,280.0 674.8,269.2 685.2,269.2" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><text x="605.0" y="115.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#222222">aluminium jig</text><rect x="800.0" y="80.0" width="380.0" height="340.0" rx="10" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><rect x="800.0" y="362.0" width="380.0" height="58.0" rx="0" fill="#f3f4f6" stroke="none" stroke-width="0" fill-opacity="1"/><line x1="800.0" y1="362.0" x2="1180.0" y2="362.0" stroke="#c9ced6" stroke-width="1.5" stroke-linecap="round"/><circle cx="822.0" cy="102.0" r="17.0" fill="#222222" stroke="white" stroke-width="2"/><text x="822.0" y="108.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18.700000000000003" text-anchor="middle" font-weight="bold" fill="white">3</text><text x="990.0" y="386.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Turn the brass screw to move it</text><text x="990.0" y="405.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">onto the seat. SLOWLY.</text><rect x="870.0" y="140.0" width="30.0" height="220.0" rx="0" fill="#b9c0c8" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="900.0" y="210.0" width="6.0" height="150.0" rx="0" fill="#e6cf9f" stroke="#222222" stroke-width="1" fill-opacity="1"/><rect x="860.0" y="360.0" width="120.0" height="14.0" rx="3" fill="#6b6b6b" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="950.0" y="120.0" width="90.0" height="230.0" rx="0" fill="#cfe4f5" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="902.0" y="280.0" width="24.0" height="60.0" rx="3" fill="#d9463b" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="926.0" y="302.0" width="40.0" height="14.0" rx="0" fill="#d4b24c" stroke="#222222" stroke-width="1.5" fill-opacity="1"/><line x1="1000.0" y1="309.0" x2="930.0" y2="309.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/><polygon points="930.0,309.0 940.8,303.8 940.8,314.2" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round" fill-opacity="1"/><polygon points="1100.0,164.3 1118.0,195.7 1082.0,195.7" fill="#f59f00" stroke="#222222" stroke-width="2" stroke-linejoin="round" fill-opacity="1"/><text x="1100.0" y="191.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22.32" text-anchor="middle" font-weight="bold" fill="#222222">!</text><text x="1100.0" y="230.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#e03131">last 2 mm:</text><text x="1100.0" y="247.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#e03131">it pulls hard!</text><rect x="20.0" y="440.0" width="380.0" height="340.0" rx="10" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><rect x="20.0" y="722.0" width="380.0" height="58.0" rx="0" fill="#f3f4f6" stroke="none" stroke-width="0" fill-opacity="1"/><line x1="20.0" y1="722.0" x2="400.0" y2="722.0" stroke="#c9ced6" stroke-width="1.5" stroke-linecap="round"/><circle cx="42.0" cy="462.0" r="17.0" fill="#222222" stroke="white" stroke-width="2"/><text x="42.0" y="468.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18.700000000000003" text-anchor="middle" font-weight="bold" fill="white">4</text><text x="210.0" y="746.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Next piece on top, white PTFE shim</text><text x="210.0" y="765.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">between. Clamp bar holds all 4</text><rect x="90.0" y="500.0" width="30.0" height="220.0" rx="0" fill="#b9c0c8" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="120.0" y="570.0" width="6.0" height="150.0" rx="0" fill="#e6cf9f" stroke="#222222" stroke-width="1" fill-opacity="1"/><rect x="80.0" y="720.0" width="120.0" height="14.0" rx="3" fill="#6b6b6b" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="122.0" y="645.0" width="24.0" height="42.0" rx="3" fill="#d9463b" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="122.0" y="599.0" width="24.0" height="42.0" rx="3" fill="#d9463b" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="120.0" y="642.0" width="28.0" height="4.0" rx="0" fill="#f7f7f7" stroke="#222222" stroke-width="1" fill-opacity="1"/><rect x="122.0" y="553.0" width="24.0" height="42.0" rx="3" fill="#d9463b" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="120.0" y="596.0" width="28.0" height="4.0" rx="0" fill="#f7f7f7" stroke="#222222" stroke-width="1" fill-opacity="1"/><rect x="122.0" y="507.0" width="24.0" height="42.0" rx="3" fill="#d9463b" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="120.0" y="550.0" width="28.0" height="4.0" rx="0" fill="#f7f7f7" stroke="#222222" stroke-width="1" fill-opacity="1"/><rect x="148.0" y="510.0" width="16.0" height="180.0" rx="0" fill="#cfe4f5" stroke="#222222" stroke-width="2" fill-opacity="1"/><text x="270.0" y="560.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#e03131">same poles PUSH</text><text x="270.0" y="580.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#e03131">each other apart:</text><text x="270.0" y="600.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222">keep the clamp</text><text x="270.0" y="620.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222">on until cured</text><rect x="410.0" y="440.0" width="380.0" height="340.0" rx="10" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><rect x="410.0" y="722.0" width="380.0" height="58.0" rx="0" fill="#f3f4f6" stroke="none" stroke-width="0" fill-opacity="1"/><line x1="410.0" y1="722.0" x2="790.0" y2="722.0" stroke="#c9ced6" stroke-width="1.5" stroke-linecap="round"/><circle cx="432.0" cy="462.0" r="17.0" fill="#222222" stroke="white" stroke-width="2"/><text x="432.0" y="468.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18.700000000000003" text-anchor="middle" font-weight="bold" fill="white">5</text><text x="600.0" y="746.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">First ALL 20 north poles, cure 24 h.</text><text x="600.0" y="765.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Then all 20 south poles.</text><circle cx="600.0" cy="480.0" r="8.5" fill="#d9463b" stroke="#d9463b" stroke-width="2"/><circle cx="617.2" cy="481.4" r="8.5" fill="white" stroke="#3b6fd1" stroke-width="2"/><circle cx="634.0" cy="485.4" r="8.5" fill="#d9463b" stroke="#d9463b" stroke-width="2"/><circle cx="649.9" cy="492.0" r="8.5" fill="white" stroke="#3b6fd1" stroke-width="2"/><circle cx="664.7" cy="501.0" r="8.5" fill="#d9463b" stroke="#d9463b" stroke-width="2"/><circle cx="677.8" cy="512.2" r="8.5" fill="white" stroke="#3b6fd1" stroke-width="2"/><circle cx="689.0" cy="525.3" r="8.5" fill="#d9463b" stroke="#d9463b" stroke-width="2"/><circle cx="698.0" cy="540.1" r="8.5" fill="white" stroke="#3b6fd1" stroke-width="2"/><circle cx="704.6" cy="556.0" r="8.5" fill="#d9463b" stroke="#d9463b" stroke-width="2"/><circle cx="708.6" cy="572.8" r="8.5" fill="white" stroke="#3b6fd1" stroke-width="2"/><circle cx="710.0" cy="590.0" r="8.5" fill="#d9463b" stroke="#d9463b" stroke-width="2"/><circle cx="708.6" cy="607.2" r="8.5" fill="white" stroke="#3b6fd1" stroke-width="2"/><circle cx="704.6" cy="624.0" r="8.5" fill="#d9463b" stroke="#d9463b" stroke-width="2"/><circle cx="698.0" cy="639.9" r="8.5" fill="white" stroke="#3b6fd1" stroke-width="2"/><circle cx="689.0" cy="654.7" r="8.5" fill="#d9463b" stroke="#d9463b" stroke-width="2"/><circle cx="677.8" cy="667.8" r="8.5" fill="white" stroke="#3b6fd1" stroke-wi