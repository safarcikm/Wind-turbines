<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="1240" height="860"><title>M11 Which magnet grade</title><rect width="100%" height="100%" fill="white"/><text x="20.0" y="34.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="start" font-weight="bold" fill="#222222">M11  Which magnet grade? Safety against demagnetising, EMF, and how easy it is to buy</text><text x="20.0" y="58.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#6b6b6b">Same flat block (8.20 mm) for every grade. Worst short circuit with the magnets at 120 °C (design case) and 150 °C (extra).</text><text x="410.0" y="112.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b6b6b">0 %</text><line x1="410.0" y1="120.0" x2="410.0" y2="750.0" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><line x1="510.0" y1="120.0" x2="510.0" y2="750.0" stroke="#2f9e44" stroke-width="2" stroke-linecap="round" stroke-dasharray="8,5"/><text x="510.0" y="112.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#2f9e44">20 % = enough</text><text x="720.0" y="90.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">margin to demagnetising</text><text x="1010.0" y="90.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">EMF at 8.2 mm</text><text x="1150.0" y="90.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">easy to buy</text><rect x="20.0" y="134.0" width="1200.0" height="54.0" rx="6" fill="#f3f4f6" stroke="none" stroke-width="2" fill-opacity="1"/><text x="40.0" y="162.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif"