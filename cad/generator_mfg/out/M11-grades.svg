-serif" font-size="18" text-anchor="middle" font-weight="normal" fill="#222222">●●●●</text><rect x="20.0" y="506.0" width="1200.0" height="54.0" rx="6" fill="#f3f4f6" stroke="none" stroke-width="2" fill-opacity="1"/><text x="40.0" y="534.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#6b6b6b">N35AH</text><text x="40.0" y="552.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#6b6b6b">NdFeB AH</text><rect x="410.0" y="514.0" width="306.5" height="16.0" rx="2" fill="#6b6b6b" stroke="none" stroke-width="2" fill-opacity="1"/><text x="722.5" y="527.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">61 % at 120 °C</text><rect x="410.0" y="534.0" width="246.0" height="16.0" rx="2" fill="#c9ced6" stroke="none" stroke-width="2" fill-opacity="1"/><text x="662.0" y="547.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">49 % at 150 °C</text><text x="1010.0" y="538.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#222222">359 V</text><text x="1150.0" y="538.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" fill="#222222">●○○○</text><rect x="20.0" y="568.0" width="1200.0" height="54.0" rx="6" fill="white" stroke="none" stroke-width="2" fill-opacity="1"/><text x="40.0" y="596.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#6b6b6b">SmCo 30H</text><text x="40.0" y="614.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#6b6b6b">Sm2Co17</text><rect x="410.0" y="576.0" width="318.5" height="16.0" rx="2" fill="#6b6b6b" stroke="none" stroke-width="2" fill-opacity="1"/><text x="734.5" y="589.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">64 % at 120 °C</text><rect x="410.0" y="596.0" width="306.0" height="16.0" rx="2" fill="#c9ced6" stroke="none" stroke-width="2" fill-opacity="1"/><text x="722.0" y="609.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">61 % at 150 °C</text><text x="1010.0" y="600.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#222222">355 V</text><text x="1150.0" y="600.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" fill="#222222">●○○○</text><rect x="20.0" y="630.0" width="1200.0" height="54.0" rx="6" fill="#f3f4f6" stroke="none" stroke-width="2" fill-opacity="1"/><text x="40.0" y="658.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#e03131">N42SH</text><text x="40.0" y="676.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#6b6b6b">NdFeB SH</text><rect x="410.0" y="638.0" width="12.5" height="16.0" rx="2" fill="#e03131" stroke="none" stroke-width="2" fill-opacity="1"/><text x="428.5" y="651.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">2 % at 120 °C</text><rect x="270.0" y="658.0" width="140.0" height="16.0" rx="2" fill="#e03131" stroke="none" stroke-width="2" fill-opacity="1"/><text x="416.0" y="671.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">-70 % at 150 °C</text><text x="1010.0" y="662.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#222222">389 V</text><text x="1150.0" y="662.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" fill="#222222">●●●●</text><rect x="20.0" y="692.0" width="1200.0" height="54.0" rx="6" fill="white" stroke="none" stroke-width="2" fill-opacity="1"/><text x="40.0" y="720.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#e03131">N48SH</text><text x="40.0" y="738.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#6b6b6b">NdFeB SH</text><rect x="392.0" y="700.0" width="18.0" height="16.0" rx="2" fill="#e03131" stroke="none" stroke-width="2" fill-opacity="1"/><text x="416.0" y="713.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">-4 % at 120 °C</text><rect x="270.0" y="720.0" width="140.0" height="16.0" rx="2" fill="#e03131" stroke="none" stroke-width="2" fill-opacity="1"/><text x="416.0" y="733.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">-81 % at 150 °C</text><text x="1010.0" y="724.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#222222">409 V</text><text x="1150.0" y="724.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" fill="#222222">●●●●</text><rect x="20.0" y="770.0" width="1200.0" height="90.0" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="2" fill-opacity="1"/><text x="40.0" y="800.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">Ask every maker for N40EH AND N40UH on the same drawing. Same size, same EMF (381 V):</text><text x="40.0" y="818.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">N40EH is the better magnet (safe even at 150 °C), N40UH is the easier one to buy and still meets the 120 °C design case.</text><text x="40.0" y="837.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222222">SH grades fail the short-circuit check. AH and samarium-cobalt are safe but weak: blocks would need 10 to 11 mm.</text></svg>