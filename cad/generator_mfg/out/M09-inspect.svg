" height="80.0" rx="3" fill="#d9463b" stroke="#222222" stroke-width="2" fill-opacity="1"/><circle cx="675.0" cy="190.0" r="30.0" fill="none" stroke="#222222" stroke-width="3"/><line x1="697.0" y1="212.0" x2="735.0" y2="250.0" stroke="#222222" stroke-width="6" stroke-linecap="round"/><circle cx="485.0" cy="290.0" r="14.0" fill="#e03131" stroke="none" stroke-width="2"/><line x1="478.7" y1="283.7" x2="491.3" y2="296.3" stroke="white" stroke-width="3.9200000000000004" stroke-linecap="round"/><line x1="478.7" y1="296.3" x2="491.3" y2="283.7" stroke="white" stroke-width="3.9200000000000004" stroke-linecap="round"/><text x="509.0" y="296.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222222">chip = scrap (oil tin)</text><rect x="810.0" y="80.0" width="380.0" height="340.0" rx="10" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><rect x="810.0" y="362.0" width="380.0" height="58.0" rx="0" fill="#f3f4f6" stroke="none" stroke-width="0" fill-opacity="1"/><line x1="810.0" y1="362.0" x2="1190.0" y2="362.0" stroke="#c9ced6" stroke-width="1.5" stroke-linecap="round"/><circle cx="832.0" cy="102.0" r="17.0" fill="#222222" stroke="white" stroke-width="2"/><text x="832.0" y="108.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18.700000000000003" text-anchor="middle" font-weight="bold" fill="white">3</text><text x="1000.0" y="386.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Size with go / no-go gauges:</text><text x="1000.0" y="405.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">20.00, 40.00, 7.50</text><rect x="880.0" y="190.0" width="240.0" height="60.0" rx="0" fill="#cfe4f5" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="960.0" y="190.0" width="80.0" height="30.0" rx="0" fill="white" stroke=