<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820"><title>M09 Check the magnets when they arrive</title><rect width="100%" height="100%" fill="white"/><text x="20.0" y="34.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="start" font-weight="bold" fill="#222222">M09  When the box arrives: 6 checks for every block (in the magnet room)</text><text x="20.0" y="58.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#6b6b6b">Two people. Only one block out of its spacer at a time. Gloves and glasses.</text><rect x="20.0" y="80.0" width="380.0" height="340.0" rx="10" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><rect x="20.0" y="362.0" width="380.0" height="58.0" rx="0" fill="#f3f4f6" stroke="none" stroke-width="0" fill-opacity="1"/><line x1="20.0" y1="362.0" x2="400.0" y2="362.0" stroke="#c9ced6" stroke-width="1.5" stroke-linecap="round"/><circle cx="42.0" cy="102.0" r="17.0" fill="#222222" stroke="white" stroke-width="2"/><text x="42.0" y="108.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18.700000000000003" text-anchor="middle" font-weight="bold" fill="white">1</text><text x="210.0" y="386.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Count and read the label:</text><text x="210.0" y="405.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">168 + 8 test pieces, one part number</text><rect x="90.0" y="180.0" width="50.0" height="30.0" rx="2" fill="#d9463b" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="86.0" y="174.0" width="58.0" height="42.0" rx="3" fill="none" stroke="#6b6b6b" stroke-width="1.5" fill-opacity="1"/><rect x="150.0" y="180.0" width="50.0" height="30.0" rx="2" fill="#d9463b" stroke="#222222" stroke