<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520"><title>G19 Safety signs</title><rect width="100%" height="100%" fill="white"/><text x="20.0" y="34.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="start" font-weight="bold" fill="#222222">G19  Safety: read this before any magnet, resin or high-voltage work</text><rect x="20.0" y="80.0" width="276.0" height="200.0" rx="10" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><circle cx="158.0" cy="148.0" r="48.0" fill="white" stroke="#e03131" stroke-width="7"/><path d="M133,123 L133,153 A25,25 0 0 0 183,153 L183,123" fill="none" stroke="#d9463b" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/><rect x="127.0" y="118.0" width="12.0" height="10.0" rx="0" fill="white" stroke="white" stroke-width="0" fill-opacity="1"/><rect x="177.0" y="118.0" width="12.0" height="10.0" rx="0" fill="white" stroke="white" stroke-width="0" fill-opacity="1"/><line x1="124.0" y1="114.0" x2="192.0" y2="182.0" stroke="#e03131" stroke-width="7" stroke-linecap="round"/><text x="158.0" y="222.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Magnets snap together</text><text x="158.0" y="240.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">and crush fingers.</text><text x="158.0" y="259.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Use the jig. Rings off.</text><rect x="312.0" y="80.0" width="276.0" height="200.0" rx="10" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><circle cx="450.0" cy="148.0" r="48.0" fill="white" stroke="#e03131" stroke-width="7"/><path d="M450,170 C410,143 432,113 450,136 C468,113 490,143 450,170 Z" fill="#e03131" stroke="#e03131" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="416.0" y1="114.0" x2="484.0" y2="182.0" stroke="#e03131" stroke-width="7" stroke-linecap="round"/><text x="450.0" y="222.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Pacemaker or ICD?</text><text x="450.0" y="240.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Do not enter the</text><text x="450.0" y="259.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">magnet room.</text><rect x="604.0" y="80.0" width="276.0" height="200.0" rx="10" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><circle cx="742.0" cy="148.0" r="48.0" fill="white" stroke="#e03131" stroke-width="7"/><rect x="717.0" y="140.0" width="50.0" height="16.0" rx="0" fill="#7d8792" stroke="#222222" stroke-width="2" fill-opacity="1"/><circle cx="722.0" cy="132.0" r="6.0" fill="#6b6b6b" stroke="#222222" stroke-width="2"/><line x1="708.0" y1="114.0" x2="776.0" y2="182.0" stroke="#e03131" stroke-width="7" stroke-linecap="round"/><text x="742.0" y="222.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">No loose steel</text><text x="742.0" y="240.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">near magnets.</text><text x="742.0" y="259.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Non-magnetic tools.</text><rect x="896.0" y="80.0" width="276.0" height="200.0" rx="10" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><circle cx="1034.0" cy="148.0" r="48.0" fill="white" stroke="#e03131" stroke-width="7"/><circle cx="1034.0" cy="148.0" r="20.0" fill="#6b6b6b" stroke="#222222" stroke-width="2"/><line x1="1056.0" y1="140.0" x2="1072.0" y2="128.0" stroke="#ff7b39" stroke-width="2" stroke-linecap="round"/><line x1="1056.0" y1="144.0" x2="1072.0" y2="136.0" stroke="#ff7b39" stroke-width="2" stroke-linecap="round"/><line x1="1056.0" y1="148.0" x2="1072.0" y2="144.0" stroke="#ff7b39" stroke-width="2" stroke-linecap="round"/><line x1="1056.0" y1="152.0" x2="1072.0" y2="152.0" stroke="#ff7b39" stroke-width="2" stroke-linecap="round"/><line x1="1056.0" y1="156.0" x2="1072.0" y2="160.0" stroke="#ff7b39" stroke-width="2" stroke-linecap="round"/><line x1="1000.0" y1="114.0" x2="1068.0" y2="182.0" stroke="#e03131" stroke-width="7" stroke-linecap="round"/><text x="1034.0" y="222.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Never grind or drill</text><text x="1034.0" y="240.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">magnets. Dust burns.</text><text x="1034.0" y="259.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Chips → oil tin.</text><rect x="20.0" y="295.0" width="276.0" height="200.0" rx="10" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><circle cx="158.0" cy="363.0" r="48.0" fill="white" stroke="#e03131" stroke-width="7"/><path d="M154,333 L142,367 L160,367 L152,393 L176,357 L159,357 L168,333 Z" fill="#f59f00" stroke="#222222" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="124.0" y1="329.0" x2="192.0" y2="397.0" stroke="#e03131" stroke-width="7" stroke-linecap="round"/><text x="158.0" y="437.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">High voltage tests</text><text x="158.0" y="455.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">only in the fenced</text><text x="158.0" y="474.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">area. Earth after.</text><rect x="312.0" y="295.0" width="276.0" height="200.0" rx="10" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><circle cx="450.0" cy="363.0" r="48.0" fill="white" stroke="#3b6fd1" stroke-width="7"/><rect x="432.0" y="343.0" width="36.0" height="40.0" rx="10" fill="#74c0fc" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="432.0" y="329.0" width="8.0" height="18.0" rx="4" fill="#74c0fc" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="441.0" y="329.0" width="8.0" height="18.0" rx="4" fill="#74c0fc" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="450.0" y="329.0" width="8.0" height="18.0" rx="4" fill="#74c0fc" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="459.0" y="329.0" width="8.0" height="18.0" rx="4" fill="#74c0fc" stroke="#222222" stroke-width="2" fill-opacity="1"/><text x="450.0" y="437.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Resin hurts skin.</text><text x="450.0" y="455.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Nitrile gloves,</text><text x="450.0" y="474.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">glasses, extraction.</text><rect x="604.0" y="295.0" width="276.0" height="200.0" rx="10" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><circle cx="742.0" cy="363.0" r="48.0" fill="white" stroke="#3b6fd1" stroke-width="7"/><path d="M717,383 L742,343 L767,383" fill="none" stroke="#f59f00" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><text x="742.0" y="437.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Lift with textile</text><text x="742.0" y="455.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">slings near the</text><text x="742.0" y="474.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">rotor, never chains.</text><rect x="896.0" y="295.0" width="276.0" height="200.0" rx="10" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><circle cx="1034.0" cy="363.0" r="48.0" fill="white" stroke="#3b6fd1" stroke-width="7"/><circle cx="1020.0" cy="349.0" r="8.0" fill="#222222" stroke="#222222" stroke-width="2"/><rect x="1011.0" y="359.0" width="18.0" height="26.0" rx="6" fill="#222222" stroke="#222222" stroke-width="2" fill-opacity="1"/><circle cx="1048.0" cy="349.0" r="8.0" fill="#222222" stroke="#222222" stroke-width="2"/><rect x="1039.0" y="359.0" width="18.0" height="26.0" rx="6" fill="#222222" stroke="#222222" stroke-width="2" fill-opacity="1"/><text x="1034.0" y="437.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Magnet work:</text><text x="1034.0" y="455.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">always two people,</text><text x="1034.0" y="474.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">one only watches.</text></svg>