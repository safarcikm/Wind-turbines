<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"><title>G17 Put the rotor over the stator</title><rect width="100%" height="100%" fill="white"/><text x="20.0" y="34.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="24" text-anchor="start" font-weight="bold" fill="#222222">G17  Put the rotor over the stator: the most dangerous step</text><text x="20.0" y="58.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#6b6b6b">≈ 27 kN of magnet pull. If the rotor goes 1 mm off centre, it pulls 1.9 kN more to that side.</text><rect x="20.0" y="80.0" width="380.0" height="380.0" rx="10" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><rect x="20.0" y="402.0" width="380.0" height="58.0" rx="0" fill="#f3f4f6" stroke="none" stroke-width="0" fill-opacity="1"/><line x1="20.0" y1="402.0" x2="400.0" y2="402.0" stroke="#c9ced6" stroke-width="1.5" stroke-linecap="round"/><circle cx="42.0" cy="102.0" r="17.0" fill="#222222" stroke="white" stroke-width="2"/><text x="42.0" y="108.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18.700000000000003" text-anchor="middle" font-weight="bold" fill="white">1</text><text x="210.0" y="426.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Clear the area: no steel, no phones,</text><text x="210.0" y="445.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">nobody with a pacemaker</text><rect x="80.0" y="370.0" width="260.0" height="20.0" rx="0" fill="#6b6b6b" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="195.0" y="150.0" width="30.0" height="220.0" rx="0" fill="#8a95a5" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="130.0" y="300.0" width="160.0" height="70.0" rx="0" fill="#5f6b7a" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="125.0" y="310.0" width="5.0" height="50.0" rx="0" fill="#d9822b" stroke="none" stroke-width="2" fill-opacity="1"/><rect x="290.0" y="310.0" width="5.0" height="50.0" rx="0" fill="#d9822b" stroke="none" stroke-width="2" fill-opacity="1"/><circle cx="90.0" cy="170.0" r="20.0" fill="#e03131" stroke="none" stroke-width="2"/><line x1="81.0" y1="161.0" x2="99.0" y2="179.0" stroke="white" stroke-width="5.6000000000000005" stroke-linecap="round"/><line x1="81.0" y1="179.0" x2="99.0" y2="161.0" stroke="white" stroke-width="5.6000000000000005" stroke-linecap="round"/><text x="90.0" y="210.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#222222">steel</text><circle cx="330.0" cy="170.0" r="20.0" fill="#e03131" stroke="none" stroke-width="2"/><line x1="321.0" y1="161.0" x2="339.0" y2="179.0" stroke="white" stroke-width="5.6000000000000005" stroke-linecap="round"/><line x1="321.0" y1="179.0" x2="339.0" y2="161.0" stroke="white" stroke-width="5.6000000000000005" stroke-linecap="round"/><text x="330.0" y="210.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#222222">pacemaker</text><rect x="410.0" y="80.0" width="380.0" height="380.0" rx="10" fill="white" stroke="#c9ced6" stroke-width="2" fill-opacity="1"/><rect x="410.0" y="402.0" width="380.0" height="58.0" rx="0" fill="#f3f4f6" stroke="none" stroke-width="0" fill-opacity="1"/><line x1="410.0" y1="402.0" x2="790.0" y2="402.0" stroke="#c9ced6" stroke-width="1.5" stroke-linecap="round"/><circle cx="432.0" cy="102.0" r="17.0" fill="#222222" stroke="white" stroke-width="2"/><text x="432.0" y="108.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18.700000000000003" text-anchor="middle" font-weight="bold" fill="white">2</text><text x="600.0" y="426.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor=